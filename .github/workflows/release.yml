name: build-and-release

on:
  push:
    tags:
      - "[0-9]*"
  # Release from the Actions tab: builds the chosen commit (the branch or tag
  # the run is started from), creates the tag named here on it, and publishes.
  # For when a tag can't be pushed from where you are.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (the tag to create), e.g. 0.3.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: wrencode-linux-x64
            build_prefix: ""
            bin_ext: ""
          - os: macos-14
            artifact_name: wrencode-macos-x64
            build_prefix: "arch -x86_64"
            bin_ext: ""
          - os: macos-14
            artifact_name: wrencode-macos-arm64
            build_prefix: ""
            bin_ext: ""
          - os: windows-latest
            artifact_name: wrencode-windows-x64.exe
            build_prefix: ""
            bin_ext: ".exe"
    runs-on: ${{ matrix.os }}

    # Use bash on every runner (Git Bash on Windows) so the build/rename steps
    # are identical across platforms.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: ${{ matrix.build_prefix }} python -m pip install --upgrade pip pyinstaller certifi

      - name: Build single-file binary
        run: ${{ matrix.build_prefix }} pyinstaller --onefile --name wrencode --paths src src/wrencode/__main__.py

      - name: Verify the binary runs and reports the version being released
        run: |
          test -f "dist/wrencode${{ matrix.bin_ext }}"
          ./dist/wrencode${{ matrix.bin_ext }} --version
          want="${{ inputs.version || github.ref_name }}"
          ./dist/wrencode${{ matrix.bin_ext }} --version | grep -qx "wrencode $want" \
            || { echo "the binary reports another version than $want"; exit 1; }

      - name: Rename artifact for platform
        run: mv "dist/wrencode${{ matrix.bin_ext }}" "dist/${{ matrix.artifact_name }}"

      - name: Publish a SHA-256 checksum beside the binary (install.sh verifies it)
        run: |
          f="dist/${{ matrix.artifact_name }}"
          (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | awk '{print $1}' > "$f.sha256"
          cat "$f.sha256"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push this is the tag; from the Actions tab the tag is
          # created here, on the commit the run was started from.
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.sha256
