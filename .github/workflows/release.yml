name: build-and-release

on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: wrencode-linux-x64
            build_prefix: ""
          - os: macos-14
            artifact_name: wrencode-macos-x64
            build_prefix: "arch -x86_64"
          - os: macos-14
            artifact_name: wrencode-macos-arm64
            build_prefix: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: ${{ matrix.build_prefix }} python -m pip install --upgrade pip pyinstaller certifi

      - name: Build single-file binary
        run: ${{ matrix.build_prefix }} pyinstaller --onefile --name wrencode wrencode.py

      - name: Rename artifact for platform
        run: mv dist/wrencode dist/${{ matrix.artifact_name }}

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
