name: publish-pypi

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Publish to ${{ inputs.target }}
        env:
          UV_PUBLISH_TOKEN: ${{ inputs.target == 'pypi' && secrets.PYPI_API_TOKEN || secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ "${{ inputs.target }}" = "pypi" ]; then
            uv publish
          else
            uv publish --publish-url https://test.pypi.org/legacy/
          fi
