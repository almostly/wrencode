name: publish-pypi

on:
  # A pushed version tag (e.g. 0.1.4.7) publishes to PyPI automatically,
  # alongside the binary build in release.yml.
  push:
    tags:
      - "[0-9]*"
  # Manual runs can still target TestPyPI (or PyPI) on demand.
  workflow_dispatch:
    inputs:
      target:
        description: "Index to publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Resolve publish target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to ${{ steps.target.outputs.name }}
        env:
          UV_PUBLISH_TOKEN: ${{ steps.target.outputs.name == 'pypi' && secrets.PYPI_API_TOKEN || secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ "${{ steps.target.outputs.name }}" = "pypi" ]; then
            uv publish
          else
            uv publish --publish-url https://test.pypi.org/legacy/
          fi
