[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wrencode"
dynamic = ["version"]
description = "A minimal agentic coding assistant in a single Python file"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Almostly" }]
keywords = [
    "agent",
    "llm",
    "coding-assistant",
    "cli",
    "ai",
    "mlx",
    "anthropic",
    "openai",
    "ollama",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]
# API backends (anthropic/openai/openrouter/ollama/local) use only the stdlib.
dependencies = []

[project.optional-dependencies]
mlx = ["mlx-lm"]
transformers = ["transformers", "torch"]

[project.scripts]
wrencode = "wrencode:main"

[project.urls]
Homepage = "https://github.com/almostly/wrencode"
Repository = "https://github.com/almostly/wrencode"
Issues = "https://github.com/almostly/wrencode/issues"

[tool.hatch.version]
path = "wrencode.py"
pattern = 'WRENCODE_VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
include = ["wrencode.py"]

[tool.hatch.build.targets.sdist]
include = ["wrencode.py", "README.md"]
